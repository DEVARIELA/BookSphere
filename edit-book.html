<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<meta name="description" content="BookSphere is a modern library management system where users can manage books, track reading status, and organize their personal library.">


<meta name="keywords" content="BookSphere, library management system, books, reading tracker, online library">


<meta name="author" content="BookSphere Team">


<meta name="robots" content="index, follow">


<meta name="theme-color" content="#00124f">


<meta property="og:title" content="BookSphere - Library Management System">


<meta property="og:description" content="Manage your personal library, organize books, and track your reading progress with BookSphere.">


<meta property="og:type" content="website">


<meta property="og:image" content="bookspherelogo.png">


<title>BookSphere - Library Management System</title>

<title>Edit Book | BookSphere</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}


body{

    background:#fcfcfc;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;

}


.container{

    width:100%;
    max-width:500px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);

}


h1{

    text-align:center;
    color:#5f464b;
    margin-bottom:25px;

}


form{

    display:flex;
    flex-direction:column;
    gap:15px;

}


input,
select,
textarea{

    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;

}


textarea{

    height:120px;
    resize:none;

}


button{

    background:#5f464b;
    color:white;
    border:none;
    padding:15px;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;

}


button:hover{

    background:#4b383d;

}


.back{

    margin-top:15px;
    background:#ddd;
    color:#333;

}


</style>

</head>


<body>


<div class="container">


<h1>Edit Book 📚</h1>


<form id="editBookForm">


<input 
type="text"
id="title"
placeholder="Book title"
required>


<input 
type="text"
id="author"
placeholder="Author"
required>


<select id="genre" required>

<option value="">Select Genre</option>

<option value="Fantasy">Fantasy</option>

<option value="Science Fiction">Science Fiction</option>

<option value="Mystery">Mystery</option>

<option value="Thriller">Thriller</option>

<option value="Horror">Horror</option>

<option value="Romance">Romance</option>

<option value="Adventure">Adventure</option>

<option value="Fiction">Fiction</option>

<option value="Classic">Classic</option>

<option value="Biography">Biography</option>

<option value="History">History</option>

<option value="Technology">Technology</option>

<option value="Science">Science</option>

<option value="Self Help">Self Help</option>

<option value="Education">Education</option>

</select>

<select id="reading_status">

<option value="reading">
Reading
</option>

<option value="completed">
Completed
</option>

<option value="want_to_read">
Want to Read
</option>

</select>


<input
type="text"
id="cover_url"
placeholder="Cover image URL">


<textarea
id="description"
placeholder="Description">
</textarea>


<input
type="number"
id="price"
placeholder="Price">


<button type="submit">
Save Changes
</button>


<button 
type="button"
class="back"
onclick="window.location.href='dashboard.html'">

Back to Dashboard

</button>


</form>


</div>


<script src="edit-book.js"></script>


</body>

</html>
