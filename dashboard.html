<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<meta name="description" content="BookSphere is a modern library management system where users can manage books, track reading status, and organize their personal library.">


<meta name="keywords" content="BookSphere, library management system, books, reading tracker, online library">


<meta name="author" content="BookSphere Team">


<meta name="robots" content="index, follow">


<meta name="theme-color" content="#00124f">


<meta property="og:title" content="BookSphere - Library Management System">


<meta property="og:description" content="Manage your personal library, organize books, and track your reading progress with BookSphere.">


<meta property="og:type" content="website">


<meta property="og:image" content="bookspherelogo.png">


<title>BookSphere - Library Management System</title>

<title>BookSphere | Personal Library</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Inter", Arial, sans-serif;
}


body{
    background:#f8eee7;
    color:#4b2e2e;
}


/* HEADER */

.header{

    background:#5f464b;
    color:white;
    padding:25px 50px;

    display:flex;
    justify-content:space-between;
    align-items:center;

}


.logo{

    display:flex;
    align-items:center;
    gap:12px;

    font-size:28px;
    font-weight:700;

}


.logo img{

    width:55px;
    height:55px;
    object-fit:contain;

}



.logout{

    background:#8e4a49;

    border:none;

    color:white;

    padding:12px 25px;

    border-radius:20px;

    cursor:pointer;

    font-weight:600;

}


/* WELCOME */

.welcome{

    padding:40px 50px;

}


.welcome h1{

    font-size:38px;
    color:#5f464b;

}


.welcome p{

    margin-top:10px;
    color:#765858;

}



/* MAIN */

.container{

    display:grid;

    grid-template-columns:280px 1fr;

    gap:30px;

    padding:0 50px 40px;

}



/* FILTERS */


.filters{

    background:#fffaf5;

    padding:30px;

    border-radius:25px;

    box-shadow:0 10px 30px rgba(0,0,0,.08);

}



.filters input,
.filters select{

    width:100%;

    padding:13px;

    margin-bottom:15px;

    border-radius:12px;

    border:1px solid #dbc8c0;

}



.add-btn{

    width:100%;

    padding:15px;

    border:none;

    border-radius:15px;

    background:#8e4a49;

    color:white;

    cursor:pointer;

}



/* LIBRARY */


.library{

    background:#fffaf5;

    padding:30px;

    border-radius:25px;

}



.library-header h2{

    color:#5f464b;

    margin-bottom:25px;

}



.book-grid{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

    gap:25px;

}



/* BOOK CARD */

.book-card{

    background:white;

    border-radius:20px;

    padding:20px;

    border:1px solid #ead8d0;

}
.book-card img {
    width: 150px;
    height: 220px;
    object-fit: cover;
    border-radius: 8px;
    display: block;
    margin: 0 auto 15px;
}



.book-cover{

    height:170px;

    background:#e8d5ca;

    border-radius:15px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:50px;

    margin-bottom:15px;

}



.book-card h3{

    color:#5f464b;

}


.status{

    display:inline-block;

    background:#d9b5a8;

    padding:6px 12px;

    border-radius:20px;

    margin-top:10px;

}




/* MOBILE */


@media(max-width:800px){

.container{

grid-template-columns:1fr;

padding:20px;

}

.header{

padding:20px;

}

}
/* ==========================
   HARRY AI ASSISTANT
========================== */


.harry-button {

    position: fixed;

    bottom: 25px;
    right: 25px;

    width: 65px;
    height: 65px;

    border-radius: 50%;

    border: none;

    background: #2196F3;

    color: white;

    font-size: 30px;

    cursor: pointer;

    box-shadow: 0 5px 15px rgba(0,0,0,0.2);

}


.harry-chat {


    position: fixed;

    bottom: 100px;
    right: 25px;


    width: 350px;
    height: 500px;


    background: #F0FAFF;


    border-radius: 20px;


    display: none;


    flex-direction: column;


    overflow: hidden;


    box-shadow: 0 10px 30px rgba(0,0,0,0.2);


}



.harry-header {


    background: #1565C0;


    color: white;


    padding: 15px;


    display:flex;


    justify-content:space-between;


    align-items:center;


}



.harry-header h3 {

    margin:0;

}



.harry-header span {

    font-size:12px;

}



.harry-header button {


    background:none;

    border:none;

    color:white;

    font-size:20px;

    cursor:pointer;


}




.harry-messages {


    flex:1;


    padding:15px;


    overflow-y:auto;


}



.harry-ai-message {


    background:#D6EEFF;


    padding:12px;


    border-radius:15px;


    margin-bottom:10px;


}



.harry-user-message {


    background:#1976D2;


    color:white;


    padding:12px;


    border-radius:15px;


    margin-bottom:10px;


    margin-left:auto;


    max-width:80%;


}



.harry-input-area {


    display:flex;


    padding:10px;


    background:white;


}



.harry-input-area input {


    flex:1;


    padding:10px;


    border-radius:20px;


    border:1px solid #ccc;


}



.harry-input-area button {


    margin-left:10px;


    border:none;


    background:#2196F3;


    color:white;


    width:45px;


    border-radius:50%;


    cursor:pointer;


} 
/* ==========================
   HARRY SUGGESTIONS
========================== */


.harry-suggestions {

    padding: 10px;

    display:flex;

    gap:8px;

    flex-wrap:wrap;

}



.harry-suggestions button {


    background:#D6EEFF;

    border:none;

    padding:8px 12px;

    border-radius:20px;

    cursor:pointer;

    color:#1565C0;

    font-size:12px;


}



.harry-suggestions button:hover {

    background:#BDE0FF;

}



/* Typing animation */


.typing {


    background:#D6EEFF;

    padding:12px;

    border-radius:15px;

    width:70px;


}



.typing span {


    display:inline-block;

    animation:typing 1.2s infinite;


}



.typing span:nth-child(2){

    animation-delay:0.2s;

}



.typing span:nth-child(3){

    animation-delay:0.4s;

}



@keyframes typing {


    0%,60%,100%{

        opacity:0.3;

    }


    30%{

        opacity:1;

    }

}

</style>


</head>


<body>



<header class="header">


<div class="logo">

<img src="bookspherelogouserdashboard.png" alt="BookSphere Logo">

<span>
BookSphere
</span>

</div>



<button class="logout" id="logoutBtn">

Logout

</button>



</header>




<section class="welcome">


<h1 id="welcomeMessage">

Welcome User 👋

</h1>


<p>
Your personal digital library space.
</p>


</section>





<section class="container">



<aside class="filters">


<h2>
Filters
</h2>


<input
type="text"
id="searchInput"
placeholder="Search books...">

<select id="genreFilter">

<option value="">All Genres</option>

<option value="Fantasy">Fantasy</option>

<option value="Science Fiction">Science Fiction</option>

<option value="Mystery">Mystery</option>

<option value="Thriller">Thriller</option>

<option value="Horror">Horror</option>

<option value="Romance">Romance</option>

<option value="Adventure">Adventure</option>

<option value="Fiction">Fiction</option>

<option value="Classic">Classic</option>

<option value="Biography">Biography</option>

<option value="History">History</option>

<option value="Technology">Technology</option>

<option value="Science">Science</option>

<option value="Self Help">Self Help</option>

<option value="Education">Education</option>


</select>

<select id="statusFilter">

<option value="">All Status</option>
<option value="reading">Reading</option>
<option value="completed">Completed</option>
<option value="want_to_read">Want to Read</option>

</select>




<button id="addBookBtn">Add Book</button>



</aside>






<section class="library">


<div class="library-header">

<h2>
📖 My Library
</h2>


</div>



<div class="book-grid" id="booksContainer">



<div class="book-card">


<div class="book-cover">

📚

</div>



<h3>
Loading books...
</h3>



<p>
Your books will appear here.
</p>


<span class="status">
Loading
</span>



</div>



</div>



</section>




</section>


<script src="dashboard.js"></script>

<!-- Harry Chatbot -->

<div class="harry-container">


    <button class="harry-button" id="harryButton">
        🤖
    </button>



    <div class="harry-chat" id="harryChat">


        <div class="harry-header">

            <div>

                <h3>🤖 Harry</h3>

                <span>
                    BookSphere AI Assistant
                </span>

            </div>


            <button id="closeHarry">

                ✕

            </button>


        </div>





        <div class="harry-messages" id="harryMessages">


            <div class="harry-ai-message" id="harryWelcome">

                Hello! I'm Harry 🤖
                <br>
                How can I help you with your library?

            </div>


        </div>




<div class="harry-suggestions">

    <button data-question="library summary">
        📚 Library Summary
    </button>


    <button data-question="statistics">
        📊 Reading Statistics
    </button>
 
    <button data-question="insights">
    📊 Library Insights
</button>

    <button data-question="favorite genre">
        🎭 Favorite Genre
    </button>


    <button data-question="recommendations">
        ✨ Recommendations
    </button>

</div>





        <div class="harry-input-area">


            <input 
            type="text" 
            id="harryInput"
            placeholder="Ask Harry..."
            >



            <button id="sendHarry">

                ➤

            </button>


        </div>



    </div>



</div>


<script src="harryAI.js"></script>



</body>

</html>
