<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BookSphere is a modern library management system where users can manage books, track reading status, and organize their personal library.">
    <meta name="keywords" content="BookSphere, library management system, books, reading tracker, online library">
    <meta name="author" content="BookSphere Team">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#00124f">
    <meta property="og:title" content="BookSphere - Library Management System">
    <meta property="og:description" content="Manage your personal library, organize books, and track your reading progress with BookSphere.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="bookspherelogo.png">

    <!-- Importimi i fontit Inter nga Google Fonts për pamje më profesionale -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <title>BookSphere | Register</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #00124f, #1c6e8c);
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: #fcfcfc;
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        /* Logo e qendruar dhe me hapësirë më të mirë */
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #00124f;
            margin-bottom: 24px;
        }

        .logo img {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }

        .auth-card h2 {
            color: #00124f;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .auth-card p.subtitle {
            color: #555;
            font-size: 15px;
            margin-bottom: 28px;
        }

        #registerForm {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #registerForm input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1.5px solid #e0e0e0;
            font-size: 15px;
            color: #333;
            outline: none;
            transition: all 0.25s ease;
            background-color: #ffffff;
        }

        #registerForm input::placeholder {
            color: #aaa;
        }

        #registerForm input:hover {
            border-color: #1c6e8c;
        }

        #registerForm input:focus {
            border-color: #48a2c2;
            box-shadow: 0 0 0 4px rgba(28, 110, 140, 0.15);
        }

        #registerForm button {
            margin-top: 8px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #8e4a49;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(142, 74, 73, 0.25);
        }

        #registerForm button:hover {
            background: #5f464b;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(95, 70, 75, 0.3);
        }

        #registerForm button:active {
            transform: translateY(0);
        }

        .auth-link {
            margin-top: 24px;
            font-size: 14px;
            color: #555;
        }

        .auth-link a {
            color: #1c6e8c;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .auth-link a:hover {
            text-decoration: underline;
            color: #00124f;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 30px 20px;
                border-radius: 20px;
            }

            .auth-card h2 {
                font-size: 22px;
            }

            .logo {
                font-size: 1.3rem;
            }

            .logo img {
                width: 36px;
                height: 36px;
            }
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <div class="auth-card">

            <div class="logo">
                <img src="bookspherelogoindex.png" alt="BookSphere Logo">
                <span>BookSphere</span>
            </div>

            <h2>Create Account</h2>
            <p class="subtitle">Join your smart personal library</p>

            <form id="registerForm">
                <input type="text" id="name" placeholder="Full Name" required autocomplete="name">
                <input type="email" id="email" placeholder="Email Address" required autocomplete="email">
                <input type="password" id="password" placeholder="Password" required autocomplete="new-password">

                <button type="submit">Register</button>
            </form>

            <p class="auth-link">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

            <p id="message"></p>

        </div>
    </div>

    <script src="register.js"></script>

</body>

</html>
